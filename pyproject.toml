[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofledger-ai"
version = "0.1.0"
description = "Object-centric, uncertainty-aware financial close controller"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PARIDHIPAWAIYA" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "networkx>=3.4,<4",
  "polars>=1.17,<2",
  "rapidfuzz>=3.10,<4",
  "scikit-learn>=1.5,<2",
  "google-genai>=1.0,<2",
  "cryptography>=44,<51",
]

[project.scripts]
proofledger = "proofledger.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "hypothesis>=6.122,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["proofledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
